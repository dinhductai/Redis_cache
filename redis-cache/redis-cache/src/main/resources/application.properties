spring.application.name=redis-cache

#ket noi database
spring.datasource.url = jdbc:mysql://localhost:3306/redis
spring.datasource.username = root
spring.datasource.password = mysqlcuatai123*
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.config.import=optional:file:.env[.properties]

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
debug=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

#cau hinh redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
#theo mac dinh thi redis docker ko co password, nen chua su dung
# spring.data.redis.password=

# Connection pool configuration (Lettuce)
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=2000ms

# Timeout settings
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms

# Shutdown timeout
spring.data.redis.lettuce.shutdown-timeout=200ms